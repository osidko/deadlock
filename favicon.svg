<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Deadlock item picker">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c060"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
  </defs>
  <!-- dark tile -->
  <rect width="32" height="32" rx="7" fill="#14100c"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#3a2e1f" stroke-width="1"/>
  <!-- gold die -->
  <rect x="5" y="5" width="22" height="22" rx="5" fill="url(#g)"/>
  <!-- five pips (random-pick motif) -->
  <g fill="#1a1408">
    <circle cx="11" cy="11" r="2.1"/>
    <circle cx="21" cy="11" r="2.1"/>
    <circle cx="16" cy="16" r="2.1"/>
    <circle cx="11" cy="21" r="2.1"/>
    <circle cx="21" cy="21" r="2.1"/>
  </g>
</svg>
